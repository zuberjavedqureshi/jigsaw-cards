# TEMPORARY DIAGNOSTICS (debug distribution only). Inspects the exact debug
# APK artifacts of two earlier runs and installs each on an Android 13
# (API 33) emulator, to diagnose "App not installed as package appears to
# be invalid" on a physical device. Remove once the issue is resolved.
name: APK install diagnostics

on:
  push:
    branches:
      - feature/gameplay-free-placement-reveal
    paths:
      - .github/workflows/apk-diagnostics.yml
      - .github/apk-diagnostics/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PACKAGE: com.example.jigsaw_cards
  # Run #1: first gameplay build (reported installed on the device).
  WORKING_RUN: "45540318833"
  WORKING_SHA256: 1f2bbd44dc6009d67cdd6f0bb73ef5ed18ba883446e369104e5641451188914d
  # Run #2: gameplay V2 build (reported "package appears to be invalid").
  FAILING_RUN: "45550055467"
  FAILING_SHA256: ee32717d13b4fe638b76133b9161725905453d8bd26aa53c2d1fa764849b13ee

jobs:
  diagnose:
    name: Inspect and install exact APKs (API 33)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download working APK (exact artifact, run 1)
        uses: actions/download-artifact@v4
        with:
          name: jigsaw-cards-gameplay-debug
          path: apks/working
          run-id: ${{ env.WORKING_RUN }}
          github-token: ${{ github.token }}

      - name: Download failing APK (exact artifact, run 2)
        uses: actions/download-artifact@v4
        with:
          name: jigsaw-cards-gameplay-debug
          path: apks/failing
          run-id: ${{ env.FAILING_RUN }}
          github-token: ${{ github.token }}

      - name: Static inspection of both APKs
        run: bash .github/apk-diagnostics/inspect.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install both APKs on an API 33 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/apk-diagnostics/install_check.sh

      - name: Upload diagnostics logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-install-diagnostics
          path: diag/
          retention-days: 14
